<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreDiligence — Live diligence for pre-seed VCs</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cpath d='M48 120 C48 186 96 230 128 244 C160 230 208 186 208 120 Z'/%3E%3Ccircle cx='92' cy='160' r='30' fill='%23fff'/%3E%3Ccircle cx='164' cy='160' r='30' fill='%23fff'/%3E%3Ccircle cx='96' cy='164' r='13'/%3E%3Ccircle cx='160' cy='164' r='13'/%3E%3Cpath d='M128 192 L137 203 L128 216 L119 203 Z' fill='%23fff'/%3E%3Cpath d='M32 118 C32 66 76 38 128 38 C180 38 224 66 224 118 C198 112 150 112 128 146 C106 112 58 112 32 118 Z' stroke='%23fff' stroke-width='10' stroke-linejoin='round'/%3E%3Crect x='119' y='16' width='18' height='34' rx='9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Outfit', 'Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } } }
</script>
<style>
  body { background: #0b0908; color: #efe9e2; }
  .bg-glow { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(900px 480px at 60% -80px, rgba(214,150,100,.14), transparent 65%), #0b0908; }
  .btn-copper { background: linear-gradient(100deg, #c98d5e 0%, #e9bd93 55%, #f6d8bc 100%); color: #1a110b; }
  .btn-copper:hover { filter: brightness(1.06); }
  .copper-text { background: linear-gradient(100deg, #c98d5e 0%, #e9bd93 55%, #f6d8bc 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  ::selection { background: rgba(217,160,112,.35); }
  .cite { display:inline-flex; align-items:center; justify-content:center; min-width:1.15rem; height:1.15rem; padding:0 .25rem;
          margin:0 1px; font-size:.65rem; font-weight:600; border-radius:.3rem; background:rgba(217,160,112,.14); color:#f3cfae;
          vertical-align: super; line-height:1; cursor:pointer; transition: all .12s; }
  .cite:hover, .cite.active { background:#d9a070; color:#1a110b; }
  .tab.active { color:#efe9e2; border-color:#d9a070; }
  .drawer { transition: transform .22s ease; }
  .drawer.closed { transform: translateX(100%); }
  .step-dot { width:.55rem; height:.55rem; border-radius:999px; display:inline-block; }
  @media print { body, .bg-glow { background:#fff !important; color:#111 !important; } aside, .no-print, #drawer { display:none !important; } main { margin:0 !important; } }
</style>
</head>
<body class="font-sans antialiased">
<div class="bg-glow"></div>

<!-- ============ SIDEBAR ============ -->
<aside class="fixed inset-y-0 left-0 w-64 bg-[#0b0908]/90 backdrop-blur border-r border-white/[0.08] text-[#a99f93] flex flex-col">
  <a href="/" title="Back to home" class="px-5 py-5 flex items-center gap-2">
    <svg class="w-8 h-8 shrink-0" viewBox="0 0 256 256" role="img" aria-label="PreDiligence logo">
      <path d="M48 120 C48 186 96 230 128 244 C160 230 208 186 208 120 Z" fill="#fff"/>
      <circle cx="92" cy="160" r="30" fill="#0f1424"/>
      <circle cx="164" cy="160" r="30" fill="#0f1424"/>
      <circle cx="96" cy="164" r="13" fill="#fff"/>
      <circle cx="160" cy="164" r="13" fill="#fff"/>
      <path d="M128 192 L137 203 L128 216 L119 203 Z" fill="#0f1424"/>
      <path d="M32 118 C32 66 76 38 128 38 C180 38 224 66 224 118 C198 112 150 112 128 146 C106 112 58 112 32 118 Z" fill="#fff" stroke="#0f1424" stroke-width="10" stroke-linejoin="round"/>
      <rect x="119" y="16" width="18" height="34" rx="9" fill="#fff"/>
    </svg>
    <span class="text-white font-semibold tracking-tight">PreDiligence</span>
    <span class="ml-auto text-[10px] uppercase tracking-wider text-[#a99f93]">beta</span>
  </a>

  <form id="newForm" class="px-4 space-y-2">
    <input id="newName" required placeholder="Startup name…" class="w-full bg-white/[0.04] border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-[#6f665d] focus:outline-none focus:border-[#d9a070]">
    <div class="relative">
      <input id="newSite" placeholder="Website (optional)" class="w-full bg-white/[0.04] border border-white/10 rounded-lg pl-3 pr-9 py-2 text-sm text-white placeholder-[#6f665d] focus:outline-none focus:border-[#d9a070]">
      <button class="absolute right-1.5 top-1.5 w-6 h-6 rounded-md btn-copper text-xs">→</button>
    </div>
  </form>

  <div class="px-5 mt-6 mb-2 text-[11px] uppercase tracking-wider text-[#a99f93] flex items-center">
    Watchlist <span class="ml-auto text-[#a99f93]">memory</span>
  </div>
  <nav id="watchlist" class="px-2 space-y-0.5 text-sm overflow-y-auto"></nav>

  <div class="mt-auto px-5 py-4 border-t border-white/5 text-[11px] text-[#a99f93] space-y-1.5">
    <div class="flex items-center gap-2"><span class="step-dot bg-emerald-400"></span>Keenable · live web + X</div>
    <div class="flex items-center gap-2"><span class="step-dot bg-emerald-400"></span>Aiven PostgreSQL · fact memory</div>
  </div>
</aside>

<!-- ============ MAIN ============ -->
<main class="ml-64 min-h-screen">
  <div id="empty" class="h-screen flex items-center justify-center">
    <div class="text-center max-w-md">
      <div class="font-display font-light text-5xl tracking-tight text-[#efe9e2]">Pre-call diligence <span class="copper-text">in 2 minutes</span></div>
      <p class="text-[#a99f93] mt-2 text-sm leading-6">Type a startup on the left. PreDiligence searches the live web and X, extracts facts, cross-checks them against what it already remembers, and writes a sourced memo.</p>
    </div>
  </div>

  <div id="view" class="hidden">
    <header class="bg-[#0b0908]/70 backdrop-blur border-b border-white/[0.08] px-8 pt-6">
      <div class="flex items-start gap-4">
        <div id="logo" class="w-12 h-12 rounded-xl bg-[#d9a070]/15 text-[#f3cfae] flex items-center justify-center font-bold text-lg"></div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <h1 id="cName" class="font-display text-2xl font-normal tracking-tight text-[#efe9e2]"></h1>
            <span id="cBadges"></span>
          </div>
          <div id="cTagline" class="text-sm text-[#a99f93] mt-0.5"></div>
        </div>
        <div class="flex items-center gap-2 no-print">
          <span id="runInfo" class="text-xs text-[#6f665d] mr-2"></span>
          <button id="recheck" class="text-sm px-3 py-1.5 rounded-lg border border-white/[0.08] hover:bg-white/[0.05]">↻ Re-check</button>
          <button onclick="window.print()" class="text-sm px-3 py-1.5 rounded-lg btn-copper hover:brightness-110">Export PDF</button>
        </div>
      </div>
      <div id="pipeline" class="mt-5 flex items-center gap-1 text-xs flex-wrap"></div>
      <div class="mt-5 flex gap-6 text-sm no-print" id="tabs">
        <button class="tab active pb-3 border-b-2 border-transparent text-[#a99f93] font-medium" data-tab="memo">Memo</button>
        <button class="tab pb-3 border-b-2 border-transparent text-[#a99f93] font-medium" data-tab="evidence">Evidence <span class="ml-1 text-[#6f665d]" id="factCount"></span></button>
        <button class="tab pb-3 border-b-2 border-transparent text-[#a99f93] font-medium" data-tab="conflicts">Conflicts <span class="ml-1 px-1.5 rounded bg-[#d9a070]/15 text-[#f3cfae] text-[11px]" id="conflictCount"></span></button>
        <button class="tab pb-3 border-b-2 border-transparent text-[#a99f93] font-medium" data-tab="changes">Changes <span class="ml-1 px-1.5 rounded bg-red-500/15 text-red-300 text-[11px]" id="changeCount"></span></button>
        <button class="tab pb-3 border-b-2 border-transparent text-[#a99f93] font-medium" data-tab="ask">Ask PreDiligence</button>
      </div>
    </header>

    <div class="px-8 py-6 max-w-6xl">
      <div id="alert"></div>
      <section id="tab-memo"></section>
      <section id="tab-evidence" class="hidden"></section>
      <section id="tab-conflicts" class="hidden"></section>
      <section id="tab-changes" class="hidden"></section>
      <section id="tab-ask" class="hidden"></section>
    </div>
  </div>
</main>

<!-- ============ EVIDENCE DRAWER ============ -->
<div id="drawer" class="drawer closed fixed inset-y-0 right-0 w-[420px] bg-[#15110e] border-l border-white/[0.08] shadow-[0_0_80px_-20px_rgba(0,0,0,.9)] flex flex-col z-20">
  <div class="px-5 py-4 border-b border-white/[0.06] flex items-center">
    <span class="text-xs uppercase tracking-wider text-[#6f665d]">Evidence</span>
    <button id="closeDrawer" class="ml-auto w-7 h-7 rounded-md hover:bg-white/[0.06] text-[#a99f93]">✕</button>
  </div>
  <div id="drawerBody" class="p-5 overflow-y-auto flex-1"></div>
</div>

<script>
const SOURCE_TYPES = {
  primary:    { label: 'Primary',  cls: 'bg-emerald-500/15 text-emerald-300', rank: 'Highest trust: company-owned' },
  press:      { label: 'Press',    cls: 'bg-sky-500/15 text-sky-300',         rank: 'High trust' },
  social:     { label: 'Social',   cls: 'bg-violet-500/15 text-violet-300',   rank: 'Signal, not proof' },
  web:        { label: 'Web',      cls: 'bg-white/[0.06] text-[#cfc6bb]',     rank: 'Medium trust' },
  database:   { label: 'Database', cls: 'bg-white/[0.06] text-[#cfc6bb]',       rank: 'Medium trust: often stale' },
};
const STATUS = {
  confirmed: { icon: '✓', label: 'Confirmed',     cls: 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30' },
  conflict:  { icon: '!', label: 'Conflict',      cls: 'bg-amber-500/10 text-amber-300 border-amber-500/30' },
  stale:     { icon: '⏱', label: 'Stale',         cls: 'bg-white/[0.06] text-[#a99f93] border-white/[0.08]' },
  single:    { icon: '1', label: 'Single source', cls: 'bg-sky-500/10 text-sky-300 border-sky-500/30' },
  reported:  { icon: '“', label: 'Self-reported', cls: 'bg-violet-500/10 text-violet-300 border-violet-500/30' },
  biased:    { icon: '⚑', label: 'Biased source', cls: 'bg-rose-500/10 text-rose-300 border-rose-500/30' },
};
const CATS = ['Status', 'Team', 'Product', 'Funding', 'Traction', 'Competition'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cite = ns => (ns || []).map(n => `<button class="cite" data-s="${n}">${n}</button>`).join('');
// "[3]" or "[3, 5]" in LLM text -> clickable citations
const withCites = t => esc(t).replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (_, g) => cite(g.split(',').map(x => x.trim())));
const st = s => STATUS[s] || STATUS.single;

let DATA = null, RUN_ID = null, POLL = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ---------- loading ---------- */
async function loadRun(id) {
  RUN_ID = id; location.hash = 'run=' + id;
  clearTimeout(POLL);
  DATA = await api('/api/runs/' + id);
  render();
  if (DATA.run.status === 'running') POLL = setTimeout(() => loadRun(id), 1500);
  else loadWatchlist();
}

async function analyze(name, website) {
  const { run_id } = await api('/api/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, website }) });
  document.querySelector('[data-tab=memo]').click();
  loadRun(run_id); loadWatchlist();
}

async function loadWatchlist() {
  const rows = await api('/api/companies');
  $('watchlist').innerHTML = rows.map(w => `
    <a href="#run=${w.run_id}" data-run="${w.run_id}" class="flex items-center gap-2 px-3 py-2 rounded-lg ${DATA && DATA.company.id === w.id ? 'bg-white/10 text-white' : 'hover:bg-white/[0.04]'}">
      <span class="truncate">${esc(w.name)}</span>
      ${w.status === 'running' ? '<span class="ml-auto step-dot bg-[#d9a070] animate-pulse"></span>' : ''}
      ${w.alert ? `<span class="ml-auto shrink-0 whitespace-nowrap text-[10px] px-1.5 py-0.5 rounded bg-red-500/15 text-red-300">Alert</span>` : ''}
    </a>`).join('') || '<div class="px-3 text-xs text-[#a99f93]">Nothing yet</div>';
}

/* ---------- render ---------- */
function render() {
  $('empty').classList.add('hidden'); $('view').classList.remove('hidden');
  const { run, company, memo, facts } = DATA;
  $('logo').textContent = company.name[0].toUpperCase();
  $('cName').textContent = company.name;
  const statusFact = facts.find(f => f.category === 'Status' && f.status !== 'stale');
  $('cBadges').innerHTML = memo?.recommendation ? `<span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${memo.recommendation === 'Pass' ? 'bg-red-500/15 text-red-300' : memo.recommendation === 'Take the call' ? 'bg-emerald-500/15 text-emerald-300' : 'bg-[#d9a070]/15 text-[#f3cfae]'}">${esc(memo.recommendation)}</span>` : '';
  $('cTagline').innerHTML = `${esc(memo?.tagline || (statusFact ? statusFact.claim : ''))}${company.website ? ` · <a href="${esc(company.website.startsWith('http') ? company.website : 'https://' + company.website)}" target="_blank" class="hover:underline">${esc(company.website)}</a>` : ''}`;
  $('runInfo').textContent = `Run #${run.number}` + (run.finished_at ? ` · ${new Date(run.finished_at).toLocaleTimeString()}` : ' · running…');
  renderPipeline();
  if (run.status === 'error') {
    $('alert').innerHTML = `<div class="mb-6 rounded-xl border border-red-400/30 bg-gradient-to-b from-red-500/10 to-[#15110e] px-5 py-4 text-sm text-red-200"><b>Run failed.</b> ${esc(run.error)}</div>`;
  } else if (memo?.alert) {
    $('alert').innerHTML = `<div class="mb-6 rounded-xl border border-red-400/30 bg-gradient-to-b from-red-500/10 to-[#15110e] px-5 py-4 flex gap-4">
      <div class="text-red-400 text-lg leading-none mt-0.5">●</div>
      <div class="text-sm"><div class="font-semibold text-red-200">${esc(memo.alert.title)}</div>
      <div class="text-red-200/70 mt-1">${withCites(memo.alert.body)}</div></div></div>`;
  } else $('alert').innerHTML = '';

  $('factCount').textContent = facts.length || '';
  $('conflictCount').textContent = memo?.conflicts?.length || '';
  $('changeCount').textContent = memo?.changes?.length || '';
  if (!memo) {
    const msg = run.status === 'error' ? '' : `<div class="bg-[#15110e] rounded-xl border border-white/[0.08] p-10 text-center text-sm text-[#a99f93]">
      <div class="animate-pulse">Agents at work — ${esc(run.stages[Math.min(run.stage, 4)])}…</div></div>`;
    ['memo', 'evidence', 'conflicts', 'changes', 'ask'].forEach(t => $('tab-' + t).innerHTML = t === 'memo' ? msg : '');
    if (facts.length) renderEvidence();
    return;
  }
  renderMemo(); renderEvidence(); renderConflicts(); renderChanges(); renderAsk();
}

function renderPipeline() {
  const { run } = DATA, s = run.stats || {};
  const detail = [
    s.queries ? `${s.queries} queries` : '',
    s.pages ? `${s.pages} sources${s.memory_sources ? ` · ${s.memory_sources} from memory` : ''}` : '',
    s.facts ? `${s.facts} facts` : '',
    s.conflicts !== undefined ? `${s.conflicts} conflicts · ${s.stale} stale` : '',
    run.status === 'done' ? '1 page' : '',
  ];
  const done = run.status === 'done' ? 5 : run.stage;
  $('pipeline').innerHTML = run.stages.map((label, i) => `
    <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg ${i < done ? 'bg-white/[0.03] text-[#cfc6bb]' : i === done && run.status === 'running' ? 'bg-[#d9a070]/10 text-[#f3cfae]' : 'text-[#4a433d]'}">
      <span class="step-dot ${i < done ? 'bg-emerald-500' : i === done && run.status === 'running' ? 'bg-[#d9a070] animate-pulse' : 'bg-white/10'}"></span>
      <span class="font-medium">${label}</span><span class="${i < done ? 'text-[#6f665d]' : ''}">${detail[i]}</span>
    </div>${i < run.stages.length - 1 ? '<span class="text-[#4a433d]">→</span>' : ''}`).join('');
}

function renderMemo() {
  const { memo, facts, sources } = DATA;
  const flags = facts.filter(f => ['conflict', 'stale', 'biased'].includes(f.status)).slice(0, 8);
  $('tab-memo').innerHTML = `
    <div class="grid grid-cols-3 gap-6">
      <article class="col-span-2 bg-[#15110e] rounded-xl border border-white/[0.08] p-7">
        <div class="text-[11px] uppercase tracking-wider text-[#6f665d] mb-4">Pre-call memo · generated from ${facts.length} verified facts · ${Object.keys(sources).length} sources</div>
        ${(memo.sections || []).map(s => `
          <h3 class="text-sm font-semibold text-[#efe9e2] mt-5 first:mt-0">${esc(s.h)}</h3>
          <p class="text-[14.5px] leading-7 text-[#cfc6bb] mt-1">${withCites(s.body)}</p>`).join('')}
        <h3 class="text-sm font-semibold text-[#efe9e2] mt-6">Questions for the founder</h3>
        <ol class="mt-2 space-y-1.5 text-[14px] text-[#cfc6bb] list-decimal list-inside">${(memo.questions || []).map(q => `<li>${withCites(q)}</li>`).join('')}</ol>
      </article>
      <div class="space-y-4">
        <div class="bg-[#15110e] rounded-xl border border-white/[0.08] p-5">
          <div class="text-[11px] uppercase tracking-wider text-[#6f665d] mb-3">Confidence</div>
          ${CATS.map(c => {
            const fs = facts.filter(f => f.category === c && f.status !== 'stale');
            if (!fs.length) return '';
            const v = Math.round(Math.max(...fs.map(f => f.confidence)) * 100);
            const col = v >= 80 ? 'bg-emerald-500' : v >= 55 ? 'bg-amber-400' : 'bg-rose-400';
            return `<div class="flex items-center gap-3 text-sm mb-2"><span class="w-24 text-[#a99f93]">${c}</span>
              <div class="flex-1 h-1.5 rounded-full bg-white/[0.06]"><div class="h-1.5 rounded-full ${col}" style="width:${v}%"></div></div>
              <span class="w-9 text-right text-xs text-[#a99f93] font-mono">${v}%</span></div>`;
          }).join('')}
        </div>
        <div class="bg-[#15110e] rounded-xl border border-white/[0.08] p-5">
          <div class="text-[11px] uppercase tracking-wider text-[#6f665d] mb-3">Red flags</div>
          ${flags.map(f => `<div class="text-sm py-2 border-t border-white/[0.06] first:border-0 first:pt-0">
            <span class="text-[11px] px-1.5 py-0.5 rounded border ${st(f.status).cls}">${st(f.status).label}</span>
            <div class="mt-1 text-[#cfc6bb]">${esc(f.claim)}${cite(f.source_ns)}</div></div>`).join('') || '<div class="text-sm text-[#6f665d]">None found</div>'}
        </div>
        <div class="bg-[#15110e] rounded-xl border border-white/[0.08] p-5 text-sm">
          <div class="text-[11px] uppercase tracking-wider text-[#6f665d] mb-3">Source mix</div>
          ${Object.entries(SOURCE_TYPES).map(([k, t]) => {
            const n = Object.values(sources).filter(s => s.source_type === k).length;
            return n ? `<div class="flex items-center justify-between py-1"><span class="text-[11px] px-1.5 py-0.5 rounded ${t.cls}">${t.label}</span><span class="font-mono text-xs text-[#a99f93]">${n}</span></div>` : '';
          }).join('')}
        </div>
      </div>
    </div>`;
}

function renderEvidence() {
  const { facts } = DATA;
  const cats = [...new Set([...CATS, ...facts.map(f => f.category)])].filter(c => facts.some(f => f.category === c));
  $('tab-evidence').innerHTML = cats.map(c => `
    <div class="bg-[#15110e] rounded-xl border border-white/[0.08] mb-4 overflow-hidden">
      <div class="px-5 py-3 border-b border-white/[0.06] text-sm font-semibold text-[#efe9e2]">${esc(c)}</div>
      ${facts.filter(f => f.category === c).map(f => `
        <div class="px-5 py-3 flex items-center gap-4 border-t border-white/[0.04] first:border-0 text-sm">
          <span class="shrink-0 w-28 text-[11px] px-2 py-1 rounded-md border text-center ${st(f.status).cls}">${st(f.status).icon} ${st(f.status).label}</span>
          <span class="flex-1 ${f.status === 'stale' ? 'line-through text-[#6f665d]' : 'text-[#e2dad0]'}">${esc(f.claim)}${f.note ? `<span class="ml-2 text-xs text-[#6f665d]">— ${esc(f.note)}</span>` : ''}</span>
          <span class="shrink-0">${cite(f.source_ns)}</span>
          <span class="shrink-0 w-10 text-right font-mono text-xs text-[#6f665d]">${Math.round(f.confidence * 100)}%</span>
        </div>`).join('')}
    </div>`).join('');
}

function renderConflicts() {
  const { memo, facts, sources } = DATA;
  const groups = memo.conflicts || [];
  $('tab-conflicts').innerHTML = groups.map(g => {
    const fs = g.facts.map(i => facts[i]).filter(Boolean);
    return `<div class="bg-[#15110e] rounded-xl border border-white/[0.08] p-5 mb-4">
      <div class="text-sm font-semibold text-[#efe9e2]">${esc(g.question)}</div>
      <div class="grid gap-3 mt-3" style="grid-template-columns: repeat(${Math.min(Math.max(fs.length, 1), 3)}, minmax(0, 1fr))">
        ${fs.map(f => {
          const s = sources[f.source_ns[0]] || {}, t = SOURCE_TYPES[s.source_type] || SOURCE_TYPES.web;
          return `<div class="rounded-lg border ${f.status === 'confirmed' ? 'border-emerald-500/40 bg-emerald-500/[0.06]' : 'border-white/[0.08]'} p-4">
            <div class="flex items-center gap-2"><span class="text-[11px] px-1.5 py-0.5 rounded ${t.cls}">${t.label}</span><span class="text-xs text-[#6f665d]">${esc(s.acquired_at || '')}</span>
              <span class="ml-auto text-[10px] px-1.5 py-0.5 rounded border ${st(f.status).cls}">${st(f.status).label}</span></div>
            <div class="mt-2 text-sm font-medium ${f.status === 'stale' ? 'line-through text-[#6f665d]' : 'text-[#efe9e2]'}">${esc(f.claim)}</div>
            <div class="mt-1 text-xs text-[#a99f93] truncate">${esc(s.title || '')}${cite(f.source_ns)}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="mt-3 text-sm text-[#a99f93] bg-white/[0.03] rounded-lg px-4 py-2.5">🧠 <span class="text-[#a99f93]">Verifier:</span> ${withCites(g.verdict)}</div>
    </div>`;
  }).join('') || '<div class="bg-[#15110e] rounded-xl border border-white/[0.08] p-8 text-center text-sm text-[#6f665d]">No conflicts between sources.</div>';
}

function renderChanges() {
  const { memo } = DATA;
  const dot = { red: 'bg-red-500', amber: 'bg-amber-400', gray: 'bg-[#6f665d]' };
  if (!memo.prev_run) {
    $('tab-changes').innerHTML = `<div class="bg-[#15110e] rounded-xl border border-white/[0.08] p-8 text-center text-sm text-[#a99f93]">
      First run for this company — facts are now stored in Aiven Postgres.<br>Hit <b>Re-check</b> later and PreDiligence will diff the new evidence against this memory.</div>`;
    return;
  }
  $('tab-changes').innerHTML = `
    <div class="bg-[#15110e] rounded-xl border border-white/[0.08] overflow-hidden">
      <div class="px-5 py-3 border-b border-white/[0.06] text-sm"><span class="font-semibold text-[#efe9e2]">Previous run → this run</span>
        <span class="ml-3 text-[#6f665d]">diffed against fact memory in Aiven Postgres</span></div>
      <table class="w-full text-sm">
        <thead class="text-[11px] uppercase tracking-wider text-[#6f665d]"><tr>
          <th class="text-left font-medium px-5 py-2">Field</th><th class="text-left font-medium py-2">Before</th><th class="text-left font-medium py-2">Now</th><th class="text-left font-medium py-2">Source</th></tr></thead>
        <tbody>${(memo.changes || []).map(r => `<tr class="border-t border-white/[0.04]">
          <td class="px-5 py-3"><span class="step-dot ${dot[r.level] || dot.gray} mr-2"></span>${esc(r.field)}</td>
          <td class="py-3 text-[#6f665d] line-through">${esc(r.before)}</td>
          <td class="py-3 font-medium text-[#efe9e2]">${esc(r.after)}</td>
          <td class="py-3">${cite(r.sources)}</td></tr>`).join('') || '<tr><td colspan="4" class="px-5 py-6 text-center text-[#6f665d]">No changes since the previous run.</td></tr>'}</tbody>
      </table>
    </div>`;
}

function renderAsk() {
  if ($('tab-ask').dataset.run === String(RUN_ID)) return;
  $('tab-ask').dataset.run = RUN_ID;
  $('tab-ask').innerHTML = `
    <div class="bg-[#15110e] rounded-xl border border-white/[0.08] flex flex-col h-[520px]">
      <div class="flex-1 overflow-y-auto p-6 space-y-5 text-sm" id="chat">
        <div class="text-[#6f665d] text-center">Ask anything about ${esc(DATA.company.name)} — answers use only the stored evidence.</div>
      </div>
      <form id="askForm" class="border-t border-white/[0.06] p-3 flex gap-2">
        <input id="askInput" class="flex-1 rounded-lg border border-white/[0.08] bg-transparent text-[#efe9e2] placeholder-[#6f665d] px-3 py-2 text-sm focus:outline-none focus:border-[#d9a070]" placeholder="e.g. Why do the funding numbers disagree?">
        <button class="px-4 rounded-lg btn-copper text-sm">Ask</button>
      </form>
    </div>`;
  $('askForm').onsubmit = async e => {
    e.preventDefault();
    const q = $('askInput').value.trim(); if (!q) return;
    $('askInput').value = '';
    const chat = $('chat');
    chat.insertAdjacentHTML('beforeend', `<div class="flex justify-end"><div class="btn-copper rounded-2xl rounded-br-sm px-4 py-2.5 max-w-md">${esc(q)}</div></div>
      <div class="flex gap-3" id="pending"><div class="w-7 h-7 shrink-0 rounded-md btn-copper text-xs font-bold flex items-center justify-center">P</div><div class="text-[#6f665d] animate-pulse">Thinking…</div></div>`);
    try {
      const r = await api(`/api/runs/${RUN_ID}/ask`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q }) });
      $('pending').lastElementChild.outerHTML = `<div class="text-[#cfc6bb] leading-7 max-w-2xl">${withCites(r.answer)}</div>`;
    } catch (err) { $('pending').lastElementChild.textContent = 'Error: ' + err.message; }
    $('pending').removeAttribute('id');
    chat.scrollTop = chat.scrollHeight;
  };
}

function openSource(n) {
  const s = DATA.sources[n]; if (!s) return;
  const t = SOURCE_TYPES[s.source_type] || SOURCE_TYPES.web;
  const usedIn = DATA.facts.filter(f => (f.source_ns || []).includes(+n));
  document.querySelectorAll('.cite').forEach(c => c.classList.toggle('active', c.dataset.s === String(n)));
  $('drawerBody').innerHTML = `
    <div class="flex items-center gap-2 flex-wrap"><span class="text-[11px] px-1.5 py-0.5 rounded ${t.cls}">${t.label}</span><span class="text-xs text-[#6f665d]">${t.rank}</span>
      ${s.from_memory ? '<span class="text-[11px] px-1.5 py-0.5 rounded bg-[#d9a070]/10 text-[#f3cfae]">From memory</span>' : ''}</div>
    <h2 class="mt-3 text-base font-semibold text-[#efe9e2] leading-snug">[${n}] ${esc(s.title)}</h2>
    <a href="${esc(s.url)}" target="_blank" class="mt-1 block text-xs text-[#e9bd93] hover:underline break-all">${esc(s.url)}</a>
    <dl class="mt-4 grid grid-cols-2 gap-3 text-xs">
      <div class="bg-white/[0.03] rounded-lg p-3"><dt class="text-[#6f665d]">Published</dt><dd class="mt-0.5 font-mono text-[#cfc6bb]">${esc(s.published_at || 'unknown')}</dd></div>
      <div class="bg-white/[0.03] rounded-lg p-3"><dt class="text-[#6f665d]">Fetched by Keenable</dt><dd class="mt-0.5 font-mono text-[#cfc6bb]">${esc(s.acquired_at || 'unknown')}</dd></div>
    </dl>
    <div class="mt-5 text-[11px] uppercase tracking-wider text-[#6f665d]">Excerpt</div>
    <blockquote class="mt-2 border-l-2 border-[#d9a070]/60 pl-4 text-sm text-[#cfc6bb] leading-6 whitespace-pre-line">${esc((s.snippet || '').slice(0, 1200))}</blockquote>
    <div class="mt-6 text-[11px] uppercase tracking-wider text-[#6f665d]">Used in ${usedIn.length} fact${usedIn.length === 1 ? '' : 's'}</div>
    <div class="mt-2 space-y-2">${usedIn.map(f => `<div class="text-sm rounded-lg border border-white/[0.06] p-3">
      <span class="text-[10px] px-1.5 py-0.5 rounded border ${st(f.status).cls}">${st(f.status).label}</span>
      <div class="mt-1.5 ${f.status === 'stale' ? 'line-through text-[#6f665d]' : 'text-[#cfc6bb]'}">${esc(f.claim)}</div></div>`).join('')}</div>`;
  $('drawer').classList.remove('closed');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const c = e.target.closest('.cite');
  if (c) { openSource(c.dataset.s); return; }
  const w = e.target.closest('[data-run]');
  if (w) { e.preventDefault(); loadRun(w.dataset.run); return; }
  const tab = e.target.closest('.tab');
  if (tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
    document.querySelectorAll('[id^="tab-"]').forEach(s => s.classList.toggle('hidden', s.id !== 'tab-' + tab.dataset.tab));
  }
});
$('closeDrawer').onclick = () => { $('drawer').classList.add('closed'); document.querySelectorAll('.cite').forEach(c => c.classList.remove('active')); };
$('recheck').onclick = () => DATA && analyze(DATA.company.name, DATA.company.website);
$('newForm').onsubmit = e => { e.preventDefault(); analyze($('newName').value.trim(), $('newSite').value.trim()); $('newName').value = ''; $('newSite').value = ''; };

// Landing page form posts here as /app?startup=<name or website>: start that run right away
function parseStartup(raw) {
  const v = raw.trim();
  if (/^\S+\.[a-z]{2,}(\/\S*)?$/i.test(v)) {
    const host = v.replace(/^https?:\/\//i, '').replace(/^www\./i, '').split('/')[0];
    const label = host.split('.')[0];
    return { name: label.charAt(0).toUpperCase() + label.slice(1), website: host };
  }
  return { name: v, website: '' };
}

loadWatchlist();
const startup = new URLSearchParams(location.search).get('startup');
const m = location.hash.match(/run=(\d+)/);
if (startup) {
  const { name, website } = parseStartup(startup);
  history.replaceState(null, '', '/app');
  analyze(name, website);
} else if (m) loadRun(m[1]);
window.addEventListener('hashchange', () => {
  const h = location.hash.match(/run=(\d+)/);
  if (h && h[1] !== String(RUN_ID)) loadRun(h[1]);
});
// landing page search bar -> /app?startup=<name or url>
const q = new URLSearchParams(location.search).get('startup');
if (q && q.trim()) {
  history.replaceState(null, '', '/app');
  const v = q.trim(), isUrl = /^(https?:\/\/)?[\w-]+(\.[\w-]+)+/i.test(v) && !/\s/.test(v);
  const name = isUrl ? v.replace(/^https?:\/\//i, '').replace(/^www\./i, '').split('/')[0].split('.')[0] : v;
  analyze(name.charAt(0).toUpperCase() + name.slice(1), isUrl ? v : '');
}
</script>
